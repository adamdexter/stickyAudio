name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Don't burn runners on superseded pushes to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: bash tests/run.sh
      # End users run these scripts with the /bin/bash shebang, which is
      # bash 3.2 on every Mac — but `bash` on the runner's PATH is Homebrew
      # bash 5. Re-run under the system shell to catch 4.0+-only syntax.
      - name: Run test suite under macOS system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck repo scripts
        run: |
          shellcheck --severity=warning \
            install.sh install-curl.sh uninstall.sh stickyaudio \
            hotkey-pause-scripts/*.sh hotkey-pause-scripts/*/*.sh \
            tests/*.sh
      # The wake script and daemon only exist as heredocs inside
      # install.sh — extract and lint them too.
      - name: Shellcheck generated wake/daemon scripts
        run: |
          awk "/<< 'WAKE_EOF'\$/,/^WAKE_EOF\$/" install.sh | sed '1d;$d' > /tmp/wake.sh
          awk "/<< 'DAEMON_EOF'\$/,/^DAEMON_EOF\$/" install.sh | sed '1d;$d' > /tmp/daemon.sh
          test -s /tmp/wake.sh && test -s /tmp/daemon.sh
          shellcheck --severity=warning /tmp/wake.sh /tmp/daemon.sh
